<!doctype html>
<html lang="es">
<title>BELA</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: agenda de papel lavanda — cabecera breve, pestañas, tarjetas por día con línea de tiempo vertical */
:root{
  --bg:#0e0a18; --paper:#17112a; --sand:#211937; --ink:#efe8ff; --muted:#a69ac8;
  --line:#2e2449; --lav:#b48cff; --lav-soft:#2a1f47; --lav-ink:#d8c6ff; --gold:#f2c46b;
  --ok:#6fe0b0; --ok-soft:#14322a; --warn:#f2c46b; --warn-soft:#352915; --bad:#ff8fa8; --bad-soft:#3d1a26;
  --uni:#9d8cff; --igl:#ff9ad5; --casa:#f2c46b; --neg:#6fd3d6; --flex:#b48cff;
  --f-display:"Exo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(120% 60% at 50% -10%,#2a1850 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:1.75rem;color:var(--lav-ink)}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
.sub{color:var(--muted);margin:4px 0 0;max-width:65ch}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.sync{font-size:.8rem;color:var(--muted)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 16px;border-bottom:1px solid var(--line);padding-bottom:10px}
nav button{font:inherit;font-weight:600;border:1px solid transparent;background:none;color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--lav-soft);color:var(--lav-ink);border-color:var(--line)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px}.grid2>*{min-width:0}.ask .btn{flex:none}.sel{user-select:all;font-weight:700;color:var(--gold)}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:600}
input[type=time],input[type=number],input[type=text],input[type=date],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row>*{min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 13px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--lav);color:#140d24}
.btn{border:1px solid var(--lav);background:var(--lav);color:#140d24;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:700}
.btn.ghost{background:none;color:var(--lav-ink)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.big{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.facts>div{background:var(--sand);border-radius:10px;padding:10px 12px}
@media (max-width:480px){.facts{grid-template-columns:1fr 1fr}}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-lav{background:var(--lav-soft);color:var(--lav-ink)}
.alerts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.alerts li{padding:9px 12px;border-radius:10px;font-size:.9rem;border-left:4px solid}
.a-bad{background:var(--bad-soft);border-color:var(--bad)}.a-warn{background:var(--warn-soft);border-color:var(--warn)}.a-ok{background:var(--ok-soft);border-color:var(--ok)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.tl .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem}
.tl .b{border-left:3px solid var(--k,var(--line));padding-left:9px}
.tl .b small{display:block;color:var(--muted)}
.k-uni{--k:var(--uni)}.k-igl{--k:var(--igl)}.k-casa{--k:var(--casa)}.k-neg{--k:var(--neg)}.k-flex{--k:var(--flex)}.k-tras{--k:var(--line)}.k-extra{--k:var(--bad)}
.week{display:grid;grid-template-columns:repeat(7,minmax(210px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.day{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day.today{border-color:var(--lav)}
.day .tl li{grid-template-columns:1fr;gap:0}
.dayhead{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--lav-soft);border-color:var(--lav);color:var(--lav-ink)}
.chip .hint{font-weight:400;color:var(--muted);font-size:.75rem;margin-left:4px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl{overflow-x:auto}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
td input[type=text]{width:100%}
td input[type=number]{width:70px}
.muted{color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.note{font-size:.85rem;color:var(--muted);max-width:70ch}
.monthweeks{display:flex;flex-direction:column;gap:10px}
.mw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
@media (max-width:560px){.mw{grid-template-columns:1fr}}
.meter{height:8px;background:var(--lav-soft);border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--lav)}
@media (prefers-reduced-motion:no-preference){nav button,.chip,.seg button{transition:background .15s,color .15s}}

/* BELA */
.bela{align-items:center;text-align:center;background:linear-gradient(180deg,#1d1435,var(--paper));border-color:#3b2d63}
.orb{position:relative;width:min(220px,62vw);aspect-ratio:1;max-width:100%;margin:6px auto 0}
.orb i,.orb b{position:absolute;border-radius:50%}
.orb i:nth-child(1){inset:0;border:2px solid transparent;border-top-color:var(--lav);border-bottom-color:var(--lav);box-shadow:0 0 24px #b48cff33}
.orb i:nth-child(2){inset:13%;border:2px solid transparent;border-left-color:var(--gold);border-right-color:var(--gold)}
.orb i:nth-child(3){inset:25%;border:1px dashed #d8c6ff66}
.orb b{inset:36%;background:radial-gradient(circle,#fff 0%,#e6d6ff 18%,var(--lav) 45%,#b48cff00 72%);box-shadow:0 0 50px #b48cff99,0 0 110px #b48cff44}
.orb[data-st="escucha"] b{background:radial-gradient(circle,#fff 0%,#ffe9b8 20%,var(--gold) 48%,#f2c46b00 74%);box-shadow:0 0 60px #f2c46baa}
.hud{font-family:var(--f-display);letter-spacing:.32em;font-size:.72rem;color:var(--gold);font-weight:700}
.say{font-size:1.02rem;max-width:52ch;margin:0;min-height:3em;color:var(--ink)}
.mic{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:14px 26px;font-weight:700;font-size:1.05rem;cursor:pointer;color:#140d24;background:linear-gradient(135deg,var(--gold),#ffd98f);box-shadow:0 0 0 6px #f2c46b22,0 8px 30px #f2c46b44}
.ask{width:100%;flex-wrap:nowrap}.ask input{flex:1;min-width:0}
.bela .chips{justify-content:center}
.log{width:100%;max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;text-align:left}
.msg{padding:8px 12px;border-radius:12px;font-size:.9rem;max-width:88%}
.msg.tu{align-self:flex-end;background:var(--lav-soft);color:var(--lav-ink)}
.msg.bela{align-self:flex-start;background:#0e0a18;border:1px solid var(--line)}
h1{font-family:var(--f-display);letter-spacing:.06em}
@media (prefers-reduced-motion:no-preference){
  .orb i:nth-child(1){animation:spin 9s linear infinite}
  .orb i:nth-child(2){animation:spin 6s linear infinite reverse}
  .orb i:nth-child(3){animation:spin 24s linear infinite}
  .orb b{animation:breathe 3.2s ease-in-out infinite}
  .orb[data-st="habla"] b{animation:breathe .45s ease-in-out infinite}
  .orb[data-st="habla"] i:nth-child(1){animation-duration:2.5s}
  .orb[data-st="escucha"] i:nth-child(2){animation-duration:1.6s}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(.92);opacity:.85}50%{transform:scale(1.06);opacity:1}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>BELA</h1>
      <p class="sub">Tu asistente personal. Organiza tu día con el negocio, la universidad y la iglesia, y te avisa a tiempo sin quitarte horas de sueño.</p>
    </div>
    <span class="sync" id="sync">Guardado en tu celular</span>
  </header>

  <nav role="tablist">
    <button role="tab" data-tab="asistente" aria-selected="true">BELA</button>
    <button role="tab" data-tab="hoy" aria-selected="false">Mi día</button>
    <button role="tab" data-tab="semana" aria-selected="false">Mi semana</button>
    <button role="tab" data-tab="mes" aria-selected="false">Semanas en casa</button>
    <button role="tab" data-tab="tareas" aria-selected="false">Tareas flexibles</button>
    <button role="tab" data-tab="ajustes" aria-selected="false">Ajustes</button>
  </nav>

  <main id="view"></main>
</div>

<script>
/* ---------- utilidades de tiempo ---------- */
const toM = s => { if(!s) return null; const [h,m]=s.split(":").map(Number); return h*60+m; };
const toS = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const fmt = m => { if(m==null) return "—"; m=((m%1440)+1440)%1440; let h=Math.floor(m/60), mi=m%60; const ap=h<12?"a. m.":"p. m."; h=h%12||12; return h+":"+String(mi).padStart(2,"0")+" "+ap; };
const pad = n => String(n).padStart(2,"0");
const ds = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addD = (s,n) => { const d=pd(s); d.setDate(d.getDate()+n); return ds(d); };
const monday = s => { const d=pd(s); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return ds(d); };
const DN = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const MN = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const nice = s => { const d=pd(s); return DN[d.getDay()]+" "+d.getDate()+" de "+MN[d.getMonth()]; };
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Math.random().toString(36).slice(2,9);

/* ---------- horario fijo (de tu documento) ---------- */
const FIXED = {
  1:[{s:"08:30",e:"10:00",l:"Clase virtual (universidad)",k:"uni"},{s:"18:00",e:"20:00",l:"Clase virtual (universidad)",k:"uni"},{s:"21:00",e:"23:00",l:"Clases de apoyo juvenil virtual",k:"igl",v:1}],
  2:[{s:"10:15",e:"11:45",l:"Clase virtual (universidad)",k:"uni"},{s:"15:30",e:"17:00",l:"Clase virtual (universidad)",k:"uni"},{s:"20:00",e:"21:30",l:"Clases de mayordomía",k:"igl"},{id:"lideresMar",l:"Reunión de líderes",k:"igl"}],
  3:[{s:"18:30",e:"20:00",l:"Clase virtual (universidad)",k:"uni"}],
  4:[{s:"08:30",e:"10:00",l:"Clase virtual (universidad)",k:"uni"},{s:"10:15",e:"11:45",l:"Clase virtual (universidad)",k:"uni"},{s:"18:00",e:"21:00",l:"Servicio en la iglesia",k:"igl"},{s:"21:30",e:"22:30",l:"Reunión de líderes",k:"igl"}],
  5:[{s:"08:30",e:"10:45",l:"Clase virtual (universidad)",k:"uni"},{s:"15:30",e:"17:00",l:"Clase virtual (universidad)",k:"uni"},{id:"ensayo",l:"Ensayo de alabanza",k:"igl"}],
  6:[{s:"18:00",e:"19:00",l:"Preparación reunión juvenil",k:"igl"},{s:"19:00",e:"21:30",l:"Reunión de jóvenes",k:"igl"},{s:"21:30",e:"22:30",l:"Líderes: evaluación",k:"igl"}],
  0:[{s:"13:30",e:"14:20",l:"Almorzar",k:"casa"},{s:"14:20",e:"15:20",l:"Ducharme",k:"casa"},{s:"15:20",e:"15:50",l:"Maquillarme y alistarme",k:"casa"},{s:"16:00",e:"19:00",l:"Servicio en la iglesia",k:"igl",noTravelBefore:1}]
};

const CATS = {uni:{n:"Universidad (obligatoria)",p:1},lid:{n:"Liderazgo y enseñanzas",p:2},esp:{n:"Vida espiritual",p:2},per:{n:"Ejercicio y canto",p:3},curso:{n:"Curso adicional",p:4},hogar:{n:"Hogar",p:5}};

/* ---------- estado ---------- */
const DEFAULT = {
  v:1,
  cfg:{wake:"06:30",goal:8,travel:7,margin:10,estSalida:"11:00",churchTravel:10,maxFlex:150,lideresMar:"pendiente",ensayo:"19:00",
       mats:["Laptop y cargador","Audífonos con micrófono","Datos o wifi revisado","Cuaderno y lapicero","Enlaces de clase a la mano","Botella de agua"]},
  days:{},   // "2026-10-13": {mom:"10:40", close:30, from:"casa|negocio|", talked:false, mats:{}, extra:[]}
  weeks:{},  // lunes: {st:"propuesta|conversar|confirmada|flexible", homeDays:[2,3]}
  tasks:[
    {id:"t1",n:"Tareas y trabajos de la universidad",d:60,c:"uni",x:3,w:"any",pref:[]},
    {id:"t2",n:"Preparar enseñanza de señoritas",d:45,c:"lid",x:2,w:"any",pref:[3,5]},
    {id:"t3",n:"Seguimiento individual a una señorita",d:45,c:"lid",x:2,w:"casa",pref:[3],coord:true},
    {id:"t4",n:"Ejercicio (incluye cambiarme y asearme)",d:45,c:"per",x:2,w:"casa",pref:[]},
    {id:"t5",n:"Práctica de canto en casa",d:20,c:"per",x:2,w:"casa",pref:[4,5]},
    {id:"t6",n:"Lavar ropa (tiempo activo)",d:40,c:"hogar",x:1,w:"casa",pref:[3,0]},
    {id:"t7",n:"Limpiar y ordenar mi habitación",d:30,c:"hogar",x:2,w:"casa",pref:[]},
    {id:"t8",n:"Inglés",d:45,c:"curso",x:3,w:"any",pref:[],pend:true},
    {id:"t9",n:"Análisis de datos",d:60,c:"curso",x:3,w:"any",pref:[],pend:true}
  ]
};
var S = JSON.parse(JSON.stringify(DEFAULT));
const LS = "mi-asistente-negocio-v1";
try{ const r=localStorage.getItem(LS); if(r) S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(r)); }catch(e){}

let dbDoc=null, saveT=null;
var save=function(){
  try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){}
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    if(!dbDoc) return;
    try{ await dbDoc.set(JSON.parse(JSON.stringify(S))); setSync("Guardado en tu cuenta"); }
    catch(e){ setSync("No se pudo guardar en tu cuenta; queda en este navegador"); }
  },600);
}
function setSync(t){ document.getElementById("sync").textContent=t; }


/* ---------- semanas en casa ---------- */
function weekOf(date){ const m=monday(date); return S.weeks[m]||null; }
function defaultWeekPlan(m){
  // Propuesta: alternar semanas (1.ª y 3.ª del mes), sin darlas por acordadas.
  const d=pd(m); const thu=new Date(d); thu.setDate(d.getDate()+3);
  const idx=Math.floor((thu.getDate()-1)/7);
  return idx%2===0 ? {st:"propuesta",homeDays:[2,3],auto:true} : {st:"flexible",homeDays:[],auto:true};
}
function getWeek(m){ return S.weeks[m]||defaultWeekPlan(m); }
function setWeek(m,patch){ S.weeks[m]=Object.assign({},getWeek(m),patch,{auto:false}); save(); render(); }

/* facilidad de estudiar desde casa por día */
function avgSalida(wd){
  const v=Object.entries(S.days).filter(([k,d])=>pd(k).getDay()===wd&&d.mom).map(([k,d])=>toM(d.mom)+(d.close??30));
  return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null;
}
function dayEase(wd){
  const unis=(FIXED[wd]||[]).filter(b=>b.k==="uni"&&b.s);
  if(!unis.length) return {lvl:"sin",t:"Sin clases"};
  const first=Math.min(...unis.map(b=>toM(b.s)));
  const need=first-S.cfg.travel-S.cfg.margin;
  const av=avgSalida(wd);
  if(first>=toM("13:00")) return {lvl:"facil",t:"Clases por la tarde o noche",need};
  if(av!=null) return av<=need?{lvl:"facil",t:"Sueles salir a tiempo",need}:{lvl:"dificil",t:"Sueles salir después de "+fmt(need),need};
  if(first>=toM("10:00")) return {lvl:"medio",t:"Debes salir a las "+fmt(need),need};
  return {lvl:"dificil",t:"Clase 8:30: coordinar con mamá",need};
}

/* ---------- cálculo de un día ---------- */
function dayRec(date){ return S.days[date]||{}; }
function setDay(date,patch){ S.days[date]=Object.assign({},dayRec(date),patch); save(); render(); }

function fixedFor(date){
  const wd=pd(date).getDay(), c=S.cfg;
  const out=[];
  for(const b of (FIXED[wd]||[])){
    if(b.id==="lideresMar"){
      const o={pendiente:{s:"21:00",e:"22:00",conf:true},despues:{s:"21:30",e:"22:30"},virtual:{s:"21:00",e:"22:00",v:1},no:null}[c.lideresMar];
      if(o) out.push(Object.assign({},b,o,{l:b.l+(c.lideresMar==="virtual"?" (virtual)":"")}));
      continue;
    }
    if(b.id==="ensayo"){ out.push(Object.assign({},b,{s:c.ensayo,e:"21:00"})); continue; }
    out.push(Object.assign({},b));
  }
  for(const x of (dayRec(date).extra||[])) out.push({s:x.s,e:x.e,l:x.l,k:"extra",place:x.p});
  return out;
}

function computeDay(date){
  const wd=pd(date).getDay(), c=S.cfg, r=dayRec(date), wk=getWeek(monday(date));
  const wake = r.wake ? toM(r.wake) : toM(c.wake);
  const rN = dayRec(addD(date,1)); const nextWake = rN.wake ? toM(rN.wake) : toM(c.wake);
  const bedAuto = nextWake+1440-Math.round(c.goal*60);
  const bed = r.bed!=null ? r.bed : bedAuto;  // hora para dormir (elegida o recomendada)
  const T=+c.travel, M=+c.margin, ct=+c.churchTravel;
  const blocks=[], alerts=[];
  const planned = wk.st!=="flexible" && (wk.homeDays||[]).includes(wd);
  const chosen = r.from!==undefined;
  const from = chosen ? r.from : (planned?"casa":"");
  const fromState = chosen ? "elegido" : (planned?(wk.st==="confirmada"?"semana confirmada":"propuesta"):"sin decidir");

  if(wake < toM("07:23")) blocks.push({s:wake,e:toM("07:23"),l:wake<=toM("07:00")?"Levantarme, alistarme y devocional breve":"Levantarme y alistarme rápido",k:"casa"});
  else { blocks.push({s:wake,e:wake+20,l:"Levantarme y alistarme rápido",k:"casa"}); alerts.push({lvl:"warn",t:`Hoy te levantaste a las ${fmt(wake)}: llegarás al negocio después de las 7:30 a. m. Avísale a tu mamá. El devocional pasa a un momento libre.`}); }
  blocks.push({s:toM("07:23"),e:toM("07:30"),l:"Traslado al negocio",k:"tras"});

  let salida, salidaTipo;
  if(wd===0){ salida=toM("13:30"); salidaTipo="fijo"; }
  else if(r.mom){ salida=toM(r.mom)+(r.close??30); salidaTipo="registrado"; }
  else { const av=avgSalida(wd); salida=av??toM(c.estSalida); salidaTipo=av!=null?"promedio de tus registros":"estimado"; }
  const llegada=salida+T;

  const fx=fixedFor(date).map(b=>Object.assign({},b,{s:toM(b.s),e:toM(b.e)}));
  // clases: ¿desde dónde?
  for(const b of fx.filter(b=>b.k==="uni")){
    if(b.s>=llegada+M){ b.where="casa"; continue; }
    if(b.s<toM("07:30")){ b.where="casa"; continue; }
    if(from==="negocio"){ b.where="negocio"; }
    else if(from==="casa"){
      const need=b.s-T-M;
      b.where="casa";
      if(salidaTipo==="fijo"||need<salida) alerts.push({lvl:r.talked?"warn":"bad",t:`Para llevar la clase de ${fmt(b.s)} desde casa necesitas salir del negocio a las ${fmt(need)}, pero tu salida ${salidaTipo==="registrado"?"registrada":salidaTipo==="fijo"?"fija":"estimada"} es a las ${fmt(salida)} y no llegarías. ${r.talked?"Ya lo conversaste con tu mamá: confirma que puedes salir a esa hora.":"Coordínalo con tu mamá o conéctate desde el negocio."}`});
    } else {
      b.where="?";
      alerts.push({lvl:"warn",t:`Clase de ${fmt(b.s)}: todavía no decides desde dónde. Para llevarla en casa debes salir a las ${fmt(b.s-T-M)}; si no es posible, prepara tus materiales para el negocio.`});
    }
  }
  // fin real del bloque negocio
  let negFin=salida;
  const homeMorning=fx.filter(b=>b.k==="uni"&&b.where==="casa"&&b.s<llegada);
  if(homeMorning.length&&from==="casa"&&wd!==0) negFin=Math.min(salida,Math.min(...homeMorning.map(b=>b.s))-T-M);
  blocks.push({s:toM("07:30"),e:negFin,l:"Negocio de mi mamá",k:"neg",note: wd===0?"Hasta la 1:30 p. m.":`Salida ${salidaTipo}: ${fmt(salida)}`+(negFin<salida?` · saldrías antes, a las ${fmt(negFin)} (por coordinar)`:"") });
  blocks.push({s:negFin,e:negFin+T,l:"Regreso a casa",k:"tras"});
  const home=negFin+T;

  // almuerzo: 12:00 o 1:00 p. m.
  if(wd!==0){
    let ls=null;
    if(home<=toM("12:00")) ls=toM("12:00");
    else if(home<=toM("13:00")) { ls=toM("13:00"); alerts.push({lvl:"warn",t:`Llegas a casa a las ${fmt(home)}: el almuerzo pasa a la 1:00 p. m.`}); }
    else alerts.push({lvl:"bad",t:`Llegas a casa a las ${fmt(home)}, después de la hora de cocinar. Acuerda con tu mamá quién cocina hoy o prepara algo la noche anterior.`});
    if(ls!=null) blocks.push({s:ls,e:ls+60,l:"Cocinar y organizar el almuerzo",k:"casa"});
  }

  for(const b of fx){
    const tr = (b.k==="igl"&&!b.v)||(b.k==="extra"&&b.place==="fuera");
    if(tr&&!b.noTravelBefore) blocks.push({s:b.s-ct,e:b.s,l:"Traslado",k:"tras"});
    if(b.noTravelBefore) blocks.push({s:toM("15:50"),e:b.s,l:"Salir de casa a la iglesia",k:"tras"});
    blocks.push({s:b.s,e:b.e,l:b.l,k:b.k,where:b.where,conf:b.conf});
  }
  // traslado de regreso tras último compromiso presencial
  const pres=fx.filter(b=>(b.k==="igl"&&!b.v)||(b.k==="extra"&&b.place==="fuera"));
  if(pres.length){ const last=Math.max(...pres.map(b=>b.e)); blocks.push({s:last,e:last+ct,l:"Regreso a casa",k:"tras"}); }

  // conflictos entre compromisos
  const firm=blocks.filter(b=>b.k!=="tras").sort((a,b)=>a.s-b.s);
  for(let i=0;i<firm.length;i++)for(let j=i+1;j<firm.length;j++){
    const a=firm[i],b=firm[j];
    if(b.s<a.e && !(a.k==="neg"&&b.where==="negocio")){
      if(a.k==="neg"&&b.k==="uni") continue; // ya avisado arriba
      alerts.push({lvl:"bad",t:`Se cruzan «${a.l}» (${fmt(a.s)}–${fmt(a.e)}) y «${b.l}» (${fmt(b.s)}–${fmt(b.e)}). Confirma cuál va primero; no se asume que puedes estar en ambas.`});
    }
  }
  if(fx.some(b=>b.conf)) alerts.push({lvl:"warn",t:"Martes: la reunión de líderes se cruza con mayordomía. Confirma en Ajustes si empieza después, si es virtual o si no asistes."});

  // sueño
  const lastEnd=Math.max(...blocks.map(b=>b.e));
  const sleepStart=Math.max(bed,lastEnd+30);
  const sleepH=((nextWake+1440)-sleepStart)/60;
  if(r.bed!=null && lastEnd+30<=bed && sleepH < c.goal-0.01) alerts.push({lvl:"warn",t:`Elegiste dormir a las ${fmt(bed)}: dormirás ${sleepH.toFixed(1)} h (meta: ${c.goal} h).`});
  if(lastEnd+30>bed) alerts.push({lvl:"bad",t:`Esta noche terminas a las ${fmt(lastEnd)}. Con 30 min para prepararte, duermes ${sleepH.toFixed(1)} h (meta: ${c.goal} h). Revisa si alguna actividad nocturna puede moverse o acortarse.`});

  blocks.sort((a,b)=>a.s-b.s||a.e-b.e);
  return {date,wd,wake,nextWake,bed,bedAuto,bedElegida:r.bed!=null,sleepStart,salida,salidaTipo,llegada:home,from,fromState,blocks,alerts,sleepH,lastEnd,negFin,uniNeg:fx.some(b=>b.where==="negocio")};
}

/* huecos libres de un día (casa) y en el negocio */
function freeWindows(day){
  const rr=dayRec(day.date);
  const lo=Math.max(day.wake, rr.desde||0), hi=Math.min(day.bed-30, 24*60);
  const busy=day.blocks.map(b=>[b.s,b.e]).sort((a,b)=>a[0]-b[0]);
  const out=[]; let cur=lo;
  for(const [s,e] of busy){ if(s>cur) out.push({s:cur,e:Math.min(s,hi),place:"casa"}); cur=Math.max(cur,e); if(cur>=hi) break; }
  if(cur<hi) out.push({s:cur,e:hi,place:"casa"});
  // hueco de estudio en el negocio (solo si ese día estudias desde allí)
  if(day.from==="negocio"&&day.wd!==0){
    const neg=day.blocks.find(b=>b.k==="neg"); const cls=day.blocks.filter(b=>b.where==="negocio");
    let c2=neg.s+30;
    for(const b of cls){ if(b.s-c2>=30) out.push({s:c2,e:b.s-5,place:"negocio"}); c2=Math.max(c2,b.e+5); }
    if(neg.e-c2>=30) out.push({s:c2,e:neg.e-5,place:"negocio"});
  }
  return out.filter(w=>w.e-w.s>=15);
}

/* ---------- plan semanal ---------- */
function planWeek(mon){
  const days=[...Array(7)].map((_,i)=>computeDay(addD(mon,i)));
  const wins=days.map(d=>freeWindows(d));
  const load=days.map(()=>0), placed=days.map(()=>[]), unplaced=[], suggestions=[];
  const tasks=[...S.tasks].sort((a,b)=>(a.pend?1:0)-(b.pend?1:0)||CATS[a.c].p-CATS[b.c].p);
  const gap=10;
  function tryPlace(di,t,dry){
    if(load[di]+t.d>S.cfg.maxFlex) return null;
    if(placed[di].some(p=>p.id===t.id)) return null;
    for(const w of wins[di]){
      if(t.w==="casa"&&w.place!=="casa") continue;
      if(w.place==="negocio"&&t.c!=="uni"&&t.c!=="curso") continue;
      const s0=Math.ceil(w.s/5)*5;
      if(w.e-s0>=t.d){
        const s=s0, e=s+t.d;
        if(!dry){ w.s=e+gap; load[di]+=t.d; const p={id:t.id,s,e,l:t.n,k:"flex",place:w.place,coord:t.coord,c:t.c}; placed[di].push(p); }
        return {s,e,place:w.place};
      }
    }
    return null;
  }
  for(const t of tasks){
    if(t.off) continue;
    const hechas = days.filter(d=>(dayRec(d.date).done||[]).includes(t.id)).length;
    days.forEach((d,di)=>{ const rr=dayRec(d.date); if((rr.done||[]).includes(t.id)||(rr.skip||[]).includes(t.id)) placed[di].push({id:t.id,dry:1}); });
    for(let k=0;k<Math.max(0,(+t.x||1)-hechas);k++){
      const order=[...Array(7).keys()].sort((a,b)=>{
        const pa=(t.pref||[]).includes(days[a].wd)?0:1, pb=(t.pref||[]).includes(days[b].wd)?0:1;
        return pa-pb || load[a]-load[b] || a-b;
      });
      let ok=false;
      for(const di of order){
        if(t.pend){ const r=tryPlace(di,t,true); if(r){ suggestions.push({t,di,...r}); placed[di].push({id:t.id,dry:1}); ok=true; break; } continue; }
        if(tryPlace(di,t,false)){ ok=true; break; }
      }
      if(!ok) unplaced.push(t);
    }
  }
  placed.forEach(a=>{ for(let i=a.length-1;i>=0;i--) if(a[i].dry) a.splice(i,1); });
  return {days,placed,unplaced,suggestions,load};
}

/* hora dicha en voz alta */
function say(m){
  m=((m%1440)+1440)%1440; const h=Math.floor(m/60), mi=m%60; const h12=h%12||12;
  if(h===0&&mi===0) return "la medianoche";
  const parte = h<5?"de la madrugada":h<12?"de la mañana":h===12?"del mediodía":h<19?"de la tarde":"de la noche";
  const art = h12===1?"la una":"las "+h12;
  const min = mi===0?"":mi===15?" y cuarto":mi===30?" y media":" y "+mi;
  return art+min+" "+parte;
}
async function hablar(texto){
  const out=document.getElementById("asTexto"); if(out) out.textContent=texto;
  if(!S.cfg.voz) return;
  try{
    if(TTS){ await TTS.stop().catch(()=>{}); await TTS.speak({text:texto,lang:"es-US",rate:+S.cfg.rate||1,pitch:1.05,volume:1,category:"playback"}); return; }

}

/* resumen hablado de un día */
function resumenDia(date,saludo){
  const d=computeDay(date); const plan=planWeek(monday(date)); const di=(d.wd+6)%7;
  const n=S.cfg.nombre?", "+S.cfg.nombre:"";
  const hoy=date===ds(new Date()), man=date===addD(ds(new Date()),1);
  let t=(saludo?(new Date().getHours()<12?"Buenos días":new Date().getHours()<19?"Buenas tardes":"Buenas noches")+n+". ":"");
  t+=(hoy?"Hoy es ":man?"Mañana es ":"El ")+nice(date).toLowerCase()+". ";
  if(d.wd===0) t+="Estarás en el negocio hasta la una y media. Sales a la iglesia a las tres y cincuenta. ";
  else if(d.negFin<d.salida) t+=`Para tu clase desde casa tendrías que salir del negocio a ${say(d.negFin)}. Coordínalo con tu mamá. `;
  else t+=`Sales del negocio ${d.salidaTipo==="registrado"?"a":"aproximadamente a"} ${say(d.negFin)}${d.salidaTipo==="estimado"?". Es una estimación, porque aún no registras la hora de regreso de tu mamá":""}. `;
  const imp=d.blocks.filter(b=>["uni","igl","extra"].includes(b.k));
  if(imp.length) t+="Tus compromisos: "+imp.map(b=>`${b.l.replace(/\(.*?\)/g,"").trim()} a ${say(b.s)}${b.where==="negocio"?", desde el negocio":b.where==="?"?", todavía sin decidir desde dónde":""}`).join("; ")+". ";
  const fl=plan.placed[di]; if(fl.length) t+="Tareas para avanzar: "+fl.map(f=>`${f.l.replace(/\(.*?\)/g,"").trim()} a ${say(f.s)}`).join("; ")+". ";
  const bad=d.alerts.filter(a=>a.lvl==="bad"); if(bad.length) t+=`Ojo, tienes ${bad.length===1?"un aviso importante":bad.length+" avisos importantes"}: ${bad[0].t} `;
  t+=d.sleepH>=S.cfg.goal?`Podrás dormir unas ${Math.floor(d.sleepH)} horas. `:`Esta noche solo podrás dormir unas ${d.sleepH.toFixed(1).replace(".0","").replace("."," coma ")} horas, así que deja lo que no sea urgente. `;
  return t+(saludo?"Tú puedes. Lo importante primero, y sin apurarte.":"");
}

/* ---------- alarmas reales en el celular ---------- */
function alarmasDe(date){
  const d=computeDay(date), al=S.cfg.al, out=[]; const plan=planWeek(monday(date)); const di=(d.wd+6)%7;
  const base=pd(date); const at=m=>{ const x=new Date(base); x.setHours(0,m,0,0); return x; };
  out.push({at:at(d.wake),t:"Buenos días ⏰",b:"Hora de levantarte y tu devocional breve.",habla:resumenDia(date,true)});
  out.push({at:at(toM("07:23")-0),t:"Salir al negocio",b:d.from==="negocio"?"Hoy estudias desde el negocio: lleva laptop, cargador y audífonos.":"Sales ahora para llegar a las 7:30 a. m."});
  if(d.negFin<d.salida && d.wd!==0) out.push({at:at(d.negFin-10),t:"Prepárate para regresar a casa",b:`En 10 minutos sales del negocio para llegar a tu clase.`});
  for(const b of d.blocks){
    if(b.k==="uni") out.push({at:at(b.s-al.uni),t:`Clase a las ${fmt(b.s)}`,b:b.where==="negocio"?"Te conectas desde el negocio. Revisa audífonos e internet.":b.where==="?"?"Aún no decides desde dónde te conectas.":"Te conectas desde casa."});
    else if(b.k==="igl"||b.k==="extra"){ const viaje=b.l.includes("virtual")||b.place==="casa"?0:S.cfg.churchTravel; out.push({at:at(b.s-viaje-al.igl),t:b.l,b:viaje?`Empieza a las ${fmt(b.s)}. Sal en ${al.igl} minutos con tus materiales.`:`Empieza a las ${fmt(b.s)}.`}); }
    else if(b.k==="casa"&&/Cocinar/.test(b.l)) out.push({at:at(b.s-al.casa),t:"Cocinar el almuerzo",b:`Empieza a las ${fmt(b.s)}.`});
    else if(b.k==="tras"&&/iglesia/.test(b.l)) out.push({at:at(b.s),t:"Salir a la iglesia",b:"Sales ahora para llegar a las 4:00 p. m."});
  }
  for(const f of plan.placed[di]) out.push({at:at(f.s-al.flex),t:f.l,b:`Bloque flexible de ${f.e-f.s} minutos.`});
  const prep=d.bed-30;
  if(d.lastEnd+30>d.bed) out.push({at:at(d.lastEnd),t:"A descansar",b:"Noche corta: deja lo no urgente para mañana."});
  else out.push({at:at(prep),t:"Prepárate para dormir",b:`Meta: dormir a ${say(d.bed)}. Deja listo lo de mañana.`,habla:resumenDia(addD(date,1),false)});
  return out;
}

  if(!LN){ alarmEstado="Las alarmas funcionan en la app instalada en tu celular."; return pintarEstado(); }

    if(!S.cfg.alarmas){ alarmEstado="Alarmas desactivadas."; return pintarEstado(); }

    }
    list.forEach(n=>{ delete n.smallIcon; }); list.sort((a,b)=>a.schedule.at-b.schedule.at); list.forEach((n,i)=>n.id=i+1);

/* ================= BELA: escucha, entiende y responde ================= */
const SR = plug("SpeechRecognition");
S.recs = S.recs || [];
let belaLog = [], espera = null;

const NUM = {una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12};
const norm = t => t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[¿?¡!.,]/g," ").replace(/\s+/g," ").trim();

/* Hora dicha en voz: "10", "10:30", "diez y media", "4 de la tarde", "7 pm" */
function parseHora(t, modo){
  t = t.replace(/\b(una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce)\b/g, w => NUM[w]);
  const R = "(\\d{1,2})(?:(?::|\\.|\\s?y\\s?)(\\d{1,2}|media|cuarto))?\\s*(de la manana|de la tarde|de la noche|am|a m|pm|p m)?\\b";
  const m = t.match(new RegExp("\\b(?:a las|a la|las|la) "+R)) || t.match(new RegExp("\\b"+R));
  if(!m) return null;
  let h = +m[1], mi = 0;
  if(h > 24) return null;
  if(m[2]) mi = m[2]==="media"?30 : m[2]==="cuarto"?15 : +m[2];
  if(mi > 59) return null;
  const ap = m[3]||"";
  if(/tarde|noche|pm|p m/.test(ap) && h < 12) h += 12;
  if(/manana|am|a m/.test(ap) && h === 12) h = 0;
  if(!ap && h <= 12){
    if(modo === "noche"){ if(h >= 7 && h < 12) h += 12; else if(h === 12) h = 24; }
    else if(modo === "mama"){ if(h <= 5) h += 12; }
    else if(h <= 6) h += 12;
  }
  return {min: h*60+mi, texto: m[0]};
}

function bloquesDesde(date, desde, hasta){
  const d = computeDay(date), p = planWeek(monday(date)), di = (d.wd+6)%7;
  return [...d.blocks.filter(b=>b.k!=="tras"), ...p.placed[di]].filter(b=>b.e>desde && b.s<hasta).sort((a,b)=>a.s-b.s);
}
const limpio = l => l.replace(/\(.*?\)/g,"").trim();
const nombre = () => S.cfg.nombre || "Brigit";


const horasTxt = h => h.toFixed(1).replace(".0","").replace("."," coma ");
const CLAVES = [/ejercicio|gimnasio|entrenar|caminar|correr/, /canto|cantar|vocal/, /ropa|lavar/, /ensenanza/, /tarea|universidad|trabajos? de la/, /senorita|seguimiento/, /limpiar|ordenar|habitacion|cuarto/, /ingles/, /analisis|datos/];
function buscarTarea(t){
  for(const re of CLAVES){ if(re.test(t)){ const k=S.tasks.find(x=>re.test(norm(x.n))); if(k) return k; } }
  return S.tasks.find(x=>norm(x.n).split(" ").some(w=>w.length>5 && t.includes(w))) || null;
}
function responder(entrada){
  const t = norm(entrada).replace(/^(oye |hola )?bela,? /,""), hoy = ds(new Date()), ahora = new Date().getHours()*60+new Date().getMinutes();

  if(espera && espera.tipo === "hora-recordatorio"){
    const h = parseHora(t);
    if(h){ const txt = espera.texto; espera = null; return crearRecordatorio(txt, h.min); }
    espera = null;
  }

  // Registrar regreso de mamá
  if(/mama|mami/.test(t) && /(regres|lleg|vino|volvi|esta aqui|ya esta)/.test(t)){
    const h = parseHora(t, "mama") || (/(ya|ahora|recien)/.test(t) ? {min: ahora} : null);
    if(!h) return "¿A qué hora regresó tu mamá? Dime, por ejemplo: mi mamá regresó a las diez y media.";
    setDay(hoy, {mom: toS(h.min)});
    const d = computeDay(hoy);
    const bad = d.alerts.filter(a=>a.lvl==="bad");
    const sal = d.salida;
    return `Listo, ${nombre()}. Registré que tu mamá regresó a ${say(h.min)}. Con ${dayRec(hoy).close??30} minutos para terminar, sales del negocio a ${say(sal)} y llegas a casa a ${say(sal+(+S.cfg.travel))}. Ya reorganicé tus tareas y alarmas.${bad.length?" Ojo: "+bad[0].t:""}`;
  }

  // Recordatorios
  const rec = t.match(/(?:recuerdame|recordarme|avisame|ponme un recordatorio(?: de| para)?|recordatorio(?: de| para)?)\s+(?:que\s+)?(.+)/);
  if(rec){
    const h = parseHora(rec[1]);
    const orig = entrada.replace(/[¿?¡!]/g," ").replace(/^.*?(recu[eé]rdame|recordarme|av[ií]same|recordatorio(\s+(de|para))?)\s+(que\s+)?/i,"");
    let txt = orig.replace(/\b(a las|a la)\s+\S+(\s+y\s+\S+)?(\s+de la (mañana|manana|tarde|noche)|\s*[ap]\.?\s?m\.?)?/i, " ").replace(/\b(hoy|mañana)\b/gi," ").replace(/\s+/g," ").replace(/[ .,]+$/,"").trim();
    if(false) txt = rec[1].replace(/\b(a las|a la)\s+\S+(\s+y\s+\S+)?(\s+de la (manana|tarde|noche)|\s*[ap]\s?m\b)?/, " ");
    txt = txt.replace(/\b(hoy|manana en la|en la|a las|a la)\b/g," ").replace(/\s+/g," ").trim();
    txt = txt.charAt(0).toUpperCase()+txt.slice(1);
    if(!txt) return "¿Qué quieres que te recuerde?";
    if(!h){ espera = {tipo:"hora-recordatorio", texto: txt}; return `De acuerdo: ${txt}. ¿A qué hora te lo recuerdo?`; }
    const manana = /\bmanana\b/.test(rec[1].replace(/de la manana/g,""));
    return crearRecordatorio(txt, h.min, manana);
  }


  // ===== Reorganizar el día =====
  const fechaDe = txt => {
    const x = txt.replace(/de la manana/g,"");
    if(/pasado manana/.test(x)) return addD(hoy,2);
    if(/\bmanana\b/.test(x)) return addD(hoy,1);
    const dias = ["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];
    for(let i=0;i<7;i++) if(new RegExp("\\b"+dias[i]+"\\b").test(x)){ const dd=(i-pd(hoy).getDay()+7)%7; return addD(hoy,dd); }
    return hoy;
  };
  const cuando = f => f===hoy?"hoy":f===addD(hoy,1)?"mañana":"el "+nice(f).toLowerCase();

  // Hora de dormir: "hoy dormiré a las 11", "me voy a acostar a las 10 y media"
  if(/(dormir|dormire|acostar|acostare|acuesto|me duermo|a la cama)/.test(t) && !/cuantas horas|horas voy|a que hora debo|que hora debo/.test(t)){
    const h = parseHora(t, "noche");
    if(h){
      let m = h.min; if(m < 6*60) m += 1440;          // después de medianoche
      const f = /\bmanana\b/.test(t.replace(/de la manana/g,"")) ? addD(hoy,1) : hoy;
      setDay(f, {bed:m});
      const d = computeDay(f), p = planWeek(monday(f)), di=(d.wd+6)%7;
      const resto = p.placed[di].filter(x=>x.s>=ahora || f!==hoy);
      let r = `Listo. ${cuando(f).charAt(0).toUpperCase()+cuando(f).slice(1)} duermes a ${say(m)}. Te levantas a ${say(d.nextWake)}, así que dormirás unas ${horasTxt(d.sleepH)} horas. `;
      r += d.sleepH < S.cfg.goal-0.01 ? `Es menos que tu meta de ${S.cfg.goal}. ` : `Cumples tu meta de sueño. `;
      if(d.lastEnd+30 > m) r += `Ojo: tu último compromiso termina a ${say(d.lastEnd)}, después de esa hora. `;
      r += resto.length ? `Reorganicé tus tareas: ${resto.map(x=>`${limpio(x.l)} a ${say(x.s)}`).join("; ")}. ` : `No quedan tareas flexibles para esa noche. `;
      return r + `Te avisaré media hora antes para prepararte.`;
    }
    if(/(normal|recomendad|de siempre)/.test(t)){ const f=hoy; const rr=Object.assign({},dayRec(f)); delete rr.bed; S.days[f]=rr; save(); render(); const d=computeDay(f); return `Volví a tu hora recomendada: dormir a ${say(d.bed)}.`; }
    return "¿A qué hora piensas dormir? Dime, por ejemplo: hoy dormiré a las once.";
  }
  // A qué hora debo dormir
  if(/a que hora (debo|deberia|tengo que) (dormir|acostarme)/.test(t)){
    const d = computeDay(hoy);
    return `Para dormir ${S.cfg.goal} horas y levantarte a ${say(d.nextWake)}, acuéstate a ${say(d.bedAuto)}.${d.lastEnd+30>d.bedAuto?` Pero hoy terminas a ${say(d.lastEnd)}, así que lo más temprano posible es ${say(d.lastEnd+30)}.`:""} Empieza a prepararte a ${say(d.bedAuto-30)}.`;
  }
  // Hora de levantarse: "me levanté a las 7", "mañana me levanto a las 6"
  if(/(me levante|me desperte|me levanto|me despierto|levantarme|despertarme)/.test(t)){
    const h = parseHora(t, "mama");
    if(!h) return "¿A qué hora te levantas? Dime, por ejemplo: mañana me levanto a las seis.";
    const f = /(me levante|me desperte)/.test(t) ? hoy : (/\bmanana\b/.test(t.replace(/de la manana/g,"")) ? addD(hoy,1) : (h.min > ahora ? hoy : addD(hoy,1)));
    setDay(f, {wake:toS(h.min)});
    const d = computeDay(f), prev = computeDay(addD(f,-1));
    let r = `Anotado: ${cuando(f)} te levantas a ${say(h.min)}. `;
    if(h.min >= toM("07:23")) r += `Llegarás al negocio después de las 7 y media, avísale a tu mamá. `;
    if(addD(f,-1)>=hoy) r += `Para descansar ${S.cfg.goal} horas, la noche anterior acuéstate a ${say(prev.bedAuto)}.${prev.bedElegida?` Habías elegido dormir a ${say(prev.bed)}: así dormirías ${horasTxt(prev.sleepH)} horas.`:""} `;
    r += `Ya ajusté tus alarmas.`;
    return r;
  }
  // Reorganizar desde ahora
  if(/(reorganiza|reacomoda|reprograma|replanifica|ordena de nuevo|vuelve a organizar|no termine|me atrase|se me hizo tarde)/.test(t)){
    const f = fechaDe(t);
    if(f===hoy) setDay(hoy, {desde: ahora+5});
    const items = bloquesDesde(f, f===hoy?ahora:0, 24*60).filter(b=>f!==hoy||b.s>=ahora);
    const p = planWeek(monday(f)); const mov = p.days.flatMap((d,i)=>d.date>f?p.placed[i].map(x=>({x,d})):[]).slice(0,3);
    let r = `Listo, reorganicé ${cuando(f)}${f===hoy?" desde ahora":""}. `;
    r += items.length ? "Te queda: "+items.map(b=>`${say(b.s)}, ${limpio(b.l)}`).join("; ")+". " : "Ya no te quedan compromisos. ";
    if(p.unplaced.length) r += `No alcanza el tiempo para: ${[...new Set(p.unplaced.map(x=>limpio(x.n)))].join(", ")}; quedan para la próxima semana. `;
    const d = computeDay(f);
    return r + `Duermes a ${say(d.sleepStart)}.`;
  }
  // Tarea hecha / omitida
  const tarea = buscarTarea(t);
  if(tarea && /(ya hice|ya termine|termine|hice|complete|listo con|ya acabe)/.test(t)){
    const f = fechaDe(t); setDay(f, {done:[...new Set([...(dayRec(f).done||[]),tarea.id])]});
    const p = planWeek(monday(f)); const quedan = p.placed.flat().filter(x=>x.id===tarea.id).length;
    return `¡Bien hecho, ${nombre()}! Marqué «${limpio(tarea.n)}» como hecha${quedan?`. Te quedan ${quedan} ${quedan===1?"vez":"veces"} esta semana`:". Ya cumpliste con esa tarea esta semana"}.`;
  }
  if(tarea && /(no hare|no voy a|no puedo|cancela|quita|salta|omite|mueve|pasa|cambia|no podre)/.test(t)){
    const f = fechaDe(t.replace(/\b(a|para) (el )?(manana|lunes|martes|miercoles|jueves|viernes|sabado|domingo)\b/,""));
    setDay(f, {skip:[...new Set([...(dayRec(f).skip||[]),tarea.id])]});
    const p = planWeek(monday(f)); const nuevo = p.days.map((d,i)=>({d,x:p.placed[i].find(y=>y.id===tarea.id)})).find(o=>o.x && o.d.date>=f && o.d.date!==f);
    return `Entendido, ${cuando(f)} no haces «${limpio(tarea.n)}».${nuevo?` La pasé al ${DN[nuevo.d.wd].toLowerCase()} a ${say(nuevo.x.s)}.`:" Esta semana ya no hay otro espacio libre sin quitarte sueño, así que queda para la próxima."}`;
  }
  // Nuevo compromiso: "tengo una reunión el miércoles a las 7 de la noche"
  const ev = t.match(/(?:tengo|agrega|anota|programa|pon)\s+(?:una?\s+)?(reunion|cita|salida|ensayo|fiesta|evento|clase|actividad|examen|exposicion|culto|vigilia|cumpleanos|almuerzo|cena|encuentro)\b(.*)/);
  if(ev){
    const h = parseHora(ev[2]);
    if(!h) return `¿A qué hora es la ${ev[1]}? Dímelo junto con el día, por ejemplo: tengo una ${ev[1]} el miércoles a las siete de la noche.`;
    const f = fechaDe(ev[2]);
    const hasta = ev[2].match(/hasta (?:las |la )?(.+)/); const hf = hasta ? parseHora("a las "+hasta[1]) : null;
    const fin = hf && hf.min>h.min ? hf.min : h.min+60;
    const original = entrada.match(/(reuni[oó]n|cita|salida|ensayo|fiesta|evento|clase|actividad|examen|exposici[oó]n|culto|vigilia|cumplea[nñ]os|almuerzo|cena|encuentro)([^,.?¡!]*?)(?=\s+(el|este|esta|hoy|mañana|pasado|a las|a la|desde|hasta)\b|$)/i);
    let nom = original ? (original[1]+original[2]).trim() : ev[1];
    nom = nom.charAt(0).toUpperCase()+nom.slice(1);
    const lugar = /(virtual|zoom|meet|en casa|online)/.test(t) ? "casa" : "fuera";
    setDay(f, {extra:[...(dayRec(f).extra||[]),{l:nom,s:toS(h.min),e:toS(Math.min(fin,1439)),p:lugar}]});
    const d = computeDay(f); const ch = d.alerts.filter(a=>a.lvl==="bad"&&a.t.includes(nom));
    return `Anotado: ${nom} ${cuando(f)} de ${say(h.min)} a ${say(fin)}${lugar==="fuera"?`, con ${S.cfg.churchTravel} minutos de traslado`:""}. ${ch.length?"Ojo: "+ch[0].t:"No choca con nada."} Reorganicé tus tareas de ese día.`;
  }
  // Desde dónde estudia hoy
  const desde = t.match(/estudi\w*\s+(?:hoy\s+)?(?:desde|en)\s+(?:el\s+|la\s+|mi\s+)?(casa|negocio|tienda)/);
  if(desde){
    const lugar = desde[1]==="casa" ? "casa" : "negocio";
    setDay(hoy, {from: lugar});
    const d = computeDay(hoy), bad = d.alerts.filter(a=>a.lvl==="bad"&&/la clase de|cocinar|llegas a casa/i.test(a.t));
    return `Anotado: hoy estudias desde ${lugar==="casa"?"casa":"el negocio"}.${lugar==="negocio"?" Lleva tu laptop, cargador y audífonos.":""}${bad.length?" Ojo: "+bad[0].t:" Todo encaja sin choques."}`;
  }

  if(/(organiza|planifica|que hago|que me toca).*(tarde)/.test(t)) return resumenTramo(hoy, Math.max(ahora, 12*60), 19*60, "esta tarde");
  if(/(organiza|planifica|que hago|que me toca).*(noche)/.test(t)) return resumenTramo(hoy, Math.max(ahora, 19*60), 24*60, "esta noche");
  if(/^(que sigue|que me toca ahora|que hago ahora|que viene|lo siguiente|cual es mi proxima actividad|que es lo siguiente)$/.test(t)){
    const b = bloquesDesde(hoy, ahora, 24*60).find(x=>x.s>=ahora);
    return b ? `Lo siguiente: ${limpio(b.l)} a ${say(b.s)}${b.where==="negocio"?", desde el negocio":""}.` : "No tienes más compromisos por hoy. Toca descansar.";
  }
  if(/(cuantas horas (voy a )?dorm|cuanto (voy a )?dorm|horas de sueno|cuanto descanso)/.test(t)){
    const d = computeDay(hoy);
    return `Hoy terminas a ${say(d.lastEnd)}. Si te acuestas a ${say(d.sleepStart)}${d.bedElegida?", como me dijiste,":""} y te levantas a ${say(d.nextWake)}, dormirás unas ${horasTxt(d.sleepH)} horas. Tu meta es ${S.cfg.goal}.`;
  }
  if(/(como (viene|esta|va) mi semana|mi semana|resumen de (la|mi) semana)/.test(t)){
    const p = planWeek(monday(hoy)), w = getWeek(monday(hoy));
    const malas = p.days.filter(d=>d.sleepH<S.cfg.goal).map(d=>DN[d.wd].toLowerCase());
    const ch = p.days.reduce((a,d)=>a+d.alerts.filter(x=>x.lvl==="bad").length,0);
    return `Esta semana ${w.st==="flexible"?"es flexible":"planeas estudiar desde casa el "+((w.homeDays||[]).map(x=>DN[x].toLowerCase()).join(" y el ")||"ningún día aún")+(w.st==="confirmada"?", ya confirmado con tu mamá":", pero falta conversarlo con tu mamá")}. ${ch?`Tienes ${ch} avisos importantes.`:"No hay choques."} ${malas.length?"Noches cortas: "+malas.join(", ")+".":"Todas las noches alcanzas tu meta de sueño."}`;
  }
  if(/^(que tengo|que hay|que me toca|como es mi dia|mi agenda de|mi horario de)? ?manana$|que tengo (para )?manana/.test(t)) return resumenDia(addD(hoy,1), false);
  if(/^(que hora es|dime la hora)$/.test(t)) return `Son ${say(ahora)}.`;
  if(/^(que tengo( hoy)?|que hay hoy|mi dia|mi agenda|mi horario|que me toca hoy|que tengo que hacer hoy|agenda de hoy|como es mi dia)$/.test(t)) return resumenDia(hoy, false);
  if(/^(muchas )?gracias( bela)?$/.test(t)) return `Con gusto, ${nombre()}. Aquí estoy cuando me necesites.`;
  if(/^(ayuda|que puedes hacer|como funcionas|que sabes hacer)$/.test(t)) return ayudaTexto();
  if(/^(hola|buenos dias|buenas tardes|buenas noches|bela|hola bela)$/.test(t)) return saludo();
  return null;  // cualquier otra pregunta va a la IA
}

function crearRecordatorio(txt, min, manana){
  const ahora = new Date().getHours()*60+new Date().getMinutes();
  let fecha = ds(new Date());
  if(manana || min <= ahora) fecha = addD(fecha, 1);
  const at = pd(fecha); at.setHours(0, min, 0, 0);
  S.recs.push({id: uid(), at: at.toISOString(), texto: txt});
  save();
  return `Listo. Te recordaré «${txt}» ${fecha===ds(new Date())?"hoy":"mañana"} a ${say(min)}.${LN?"":" Recuerda que la alarma suena en la app instalada."}`;
}
function resumenTramo(date, desde, hasta, etiqueta){
  const items = bloquesDesde(date, desde, hasta);
  if(!items.length) return `${etiqueta.charAt(0).toUpperCase()+etiqueta.slice(1)} la tienes libre. Puedes descansar o adelantar algo pendiente.`;
  return `Así queda ${etiqueta}: ` + items.map(b=>`${say(b.s)}, ${limpio(b.l)}`).join("; ") + ". Lo demás es tiempo libre.";
}
function ayudaTexto(){
  return "Puedes decirme: qué tengo hoy o mañana, qué sigue, hoy dormiré a las once, mañana me levanto a las seis, reorganiza mi día, ya hice mi ejercicio, hoy no haré la tarea de la universidad, tengo una reunión el miércoles a las siete de la noche, mi mamá regresó a las diez, o recuérdame llamar a una señorita a las cinco.";
}
function saludo(){
  const h = new Date().getHours();
  const s = h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches";
  const d = computeDay(ds(new Date())), ahora = h*60+new Date().getMinutes();
  const b = bloquesDesde(ds(new Date()), ahora, 24*60).find(x=>x.s>=ahora);
  return `${s}, ${nombre()}. Soy BELA, tu asistente.${b?` Lo próximo: ${limpio(b.l)} a ${say(b.s)}.`:" Ya no tienes más compromisos hoy."} ¿En qué te ayudo?`;
}

/* orbe animado */
function orbe(estado){ const o=document.getElementById("orb"); if(o){ o.dataset.st=estado||""; } const s=document.getElementById("orbSt"); if(s) s.textContent = estado==="habla"?"BELA · HABLANDO":estado==="escucha"?"BELA · ESCUCHANDO":"BELA · EN LÍNEA"; }

hablar = async function(texto){
  const out=document.getElementById("asTexto"); if(out) out.textContent=texto;
  if(!S.cfg.voz) return;
  orbe("habla");
  try{
    if(TTS){ await TTS.stop().catch(()=>{}); await TTS.speak({text:texto,lang:"es-US",rate:+S.cfg.rate||1,pitch:1.08,volume:1,category:"playback"}); }
    else if("speechSynthesis" in window){
      await new Promise(res=>{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(texto); u.lang="es-ES"; u.rate=+S.cfg.rate||1; u.pitch=1.08; u.onend=res; u.onerror=res; speechSynthesis.speak(u); setTimeout(res, 60000); });
    }
  }catch(e){}
  orbe("");
};

function conversar(entrada){
  if(!entrada || !entrada.trim()) return;
  const r = responder(entrada);
  belaLog.push({tu: entrada.trim(), bela: r}); if(belaLog.length>6) belaLog.shift();
  pintarLog(); hablar(r);
}
function pintarLog(){
  const el=document.getElementById("belaLog"); if(!el) return;
  el.innerHTML = belaLog.map(x=>`<div class="msg tu">${esc(x.tu)}</div><div class="msg bela">${esc(x.bela)}</div>`).join("");
  el.scrollTop = el.scrollHeight;
}

async function escuchar(){
  const st = document.getElementById("asTexto");
  try{
    if(SR){
      const av = await SR.available().catch(()=>({available:false}));
      if(!av.available){ st.textContent="Tu celular no tiene reconocimiento de voz. Instala o actualiza la app de Google."; return; }
      let p = await SR.checkPermissions(); if(p.speechRecognition!=="granted") p = await SR.requestPermissions();
      if(p.speechRecognition!=="granted"){ st.textContent="Necesito permiso del micrófono. Actívalo en Ajustes → Apps → BELA → Permisos."; return; }
      orbe("escucha");
      const r = await SR.start({language:"es-419",maxResults:1,prompt:"Te escucho, "+nombre(),partialResults:false,popup:true});
      orbe("");
      const txt = r && r.matches && r.matches[0];
      if(txt) conversar(txt); else st.textContent="No te escuché. Toca el micrófono e inténtalo otra vez.";
      return;
    }
    const W = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!W){ st.textContent="Aquí no puedo usar el micrófono. Escríbeme tu pedido abajo."; return; }
    const rec = new W(); rec.lang="es-PE"; rec.interimResults=false; rec.maxAlternatives=1;
    orbe("escucha");
    rec.onresult = e => { orbe(""); conversar(e.results[0][0].transcript); };
    rec.onerror = () => { orbe(""); st.textContent="No pude usar el micrófono. Escríbeme tu pedido abajo."; };
    rec.onend = () => { if(document.getElementById("orb")?.dataset.st==="escucha") orbe(""); };
    rec.start();
  }catch(e){ orbe(""); st.textContent="No te escuché bien. Inténtalo de nuevo o escríbeme abajo."; }
}

/* recordatorios propios dentro de las alarmas */
const _prog0 = _programar;
_programar = async function(){
  await _prog0();
  if(!LN || !S.cfg.alarmas) return;
  const now = Date.now();
  S.recs = S.recs.filter(r => new Date(r.at).getTime() > now - 3600e3);
  const list = S.recs.filter(r=>new Date(r.at).getTime()>now+30000).map((r,i)=>({id:5000+i,title:"BELA te recuerda",body:r.texto,schedule:{at:new Date(r.at),allowWhileIdle:true},channelId:"mi-asistente",extra:{habla:`${nombre()}, te recuerdo: ${r.texto}.`}}));
  try{ if(list.length) await LN.schedule({notifications:list}); }catch(e){}
};

       <label class="f">Antes de cocinar (min)<input type="number" id="al-casa" min="0" value="${c.al.casa}"></label>
     </div>
     ${S.recs.length?`<h3>Recordatorios que le pediste a BELA</h3><ul class="alerts">${S.recs.map(r=>`<li class="a-ok">${esc(r.texto)} · ${nice(ds(new Date(r.at)))} ${fmt(new Date(r.at).getHours()*60+new Date(r.at).getMinutes())} <button class="btn ghost sm" data-delrec="${r.id}">Quitar</button></li>`).join("")}</ul>`:""}
     <h3>Voz</h3>
     <div class="row">
       <label class="check"><input type="checkbox" id="asVoz" ${c.voz?"checked":""}> Que BELA me hable</label>
       <label class="f">Velocidad<select id="asRate">${[[0.85,"Lenta"],[1,"Normal"],[1.15,"Rápida"]].map(([v,t])=>`<option value="${v}" ${+c.rate===v?"selected":""}>${t}</option>`).join("")}</select></label>
       <label class="f">Cómo te llamo<input type="text" id="asNom" value="${esc(c.nombre)}"></label>
     </div>
     ${panelIA()}
   </section></div>`;
  const $=id=>document.getElementById(id);
  pintarLog();
  $("mic").onclick=escuchar;
  $("belaForm").onsubmit=e=>{ e.preventDefault(); const v=$("belaIn").value; $("belaIn").value=""; conversar(v); };
  view.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>conversar(b.dataset.q));
  view.querySelector("[data-callar]").onclick=()=>{ try{ TTS?TTS.stop():speechSynthesis.cancel(); }catch(e){} orbe(""); };
  view.querySelectorAll("[data-delrec]").forEach(b=>b.onclick=()=>{ S.recs=S.recs.filter(r=>r.id!==b.dataset.delrec); save(); render(); });
  $("asAct").onclick=activarAlarmas;
  $("asOn").onchange=e=>{ c.alarmas=e.target.checked; save(); };
  ["uni","igl","casa"].forEach(k=>$("al-"+k).onchange=e=>{ c.al[k]=Math.max(0,+e.target.value||0); save(); });
  $("asVoz").onchange=e=>{ c.voz=e.target.checked; save(); };
  $("asRate").onchange=e=>{ c.rate=+e.target.value; save(); };
  $("asNom").onchange=e=>{ c.nombre=e.target.value.trim(); save(); render(); };
  bindIA();
}

/* ================= BELA + IA (preguntas libres con Gemini) ================= */
const IA_LS = "bela-ia-clave";
const IA_MODELOS = ["gemini-3.5-flash-lite","gemini-3.8-flash","gemini-2.5-flash"];
let iaHist = [];
const iaClave = () => { try{ return localStorage.getItem(IA_LS)||""; }catch(e){ return ""; } };
const iaGuardar = k => { try{ k?localStorage.setItem(IA_LS,k.trim()):localStorage.removeItem(IA_LS); }catch(e){} };
const sinMarkdown = x => x.replace(/```[\s\S]*?```/g," ").replace(/[*_#>`]+/g,"").replace(/^\s*[-•]\s+/gm,"").replace(/\n{2,}/g,"\n").trim();

function contextoIA(){
  const hoy = ds(new Date()), ahora = new Date().getHours()*60+new Date().getMinutes();
  return `Eres BELA, la asistente personal por voz de ${nombre()}, una estudiante universitaria de Ingeniería de Sistemas en Lima, Perú. Hablas en español peruano, con calidez, de forma clara y breve.
Responde cualquier pregunta que te haga, de cualquier tema: estudios, Biblia, cocina, consejos, cultura general, tecnología, etc.
Tus respuestas se leen en voz alta: usa 2 a 5 frases cortas, sin listas largas, sin símbolos, sin markdown, sin emojis. Si piden algo más largo, resume lo esencial y ofrece continuar.
Si no sabes algo o puede haber cambiado, dilo con honestidad. Para temas de salud, legales o de dinero, da información general y sugiere consultar a un profesional.
No inventes compromisos. Si te pide cambiar su horario, dile que use frases como «hoy dormiré a las once» o «reorganiza mi día», porque esas las hace la app directamente.
Ahora son ${say(ahora)} del ${nice(hoy).toLowerCase()}.
Su día de hoy: ${resumenDia(hoy,false)}
Mañana: ${resumenDia(addD(hoy,1),false)}`;
}

async function preguntarIA(pregunta){
  const clave = iaClave();
  if(!clave) return `Para responder preguntas de cualquier tema necesito que me conectes a la inteligencia de Google. Ve abajo, a «Preguntas libres», y pega tu clave gratuita. Mientras tanto, ${ayudaTexto().charAt(0).toLowerCase()+ayudaTexto().slice(1)}`;
  if(navigator.onLine === false) return "No tengo internet ahora. Las órdenes de tu horario sí funcionan sin conexión.";
  const contents = [...iaHist, {role:"user", parts:[{text:pregunta}]}];
  const body = JSON.stringify({systemInstruction:{parts:[{text:contextoIA()}]}, contents, generationConfig:{maxOutputTokens:600, temperature:0.7}});
  const modelos = [S.cfg.iaModelo, ...IA_MODELOS].filter((m,i,a)=>m && a.indexOf(m)===i);
  for(const m of modelos){
    const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 30000);
    try{
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`, {method:"POST", headers:{"Content-Type":"application/json","x-goog-api-key":clave}, body, signal:ctl.signal});
      clearTimeout(to);
      if(res.status===404) continue;
      if(res.status===429) return "Por ahora llegué al límite gratuito de preguntas. Inténtalo de nuevo en un minuto.";
      if(res.status===400||res.status===401||res.status===403){ const e=await res.json().catch(()=>({})); const msg=(e.error&&e.error.message)||""; if(/api key|API_KEY|permission/i.test(msg)||res.status!==400) return "Tu clave de Google no funciona. Revisa que la copiaste completa en «Preguntas libres»."; continue; }
      if(!res.ok) continue;
      const data = await res.json();
      const txt = sinMarkdown(((data.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||"").join(""));
      if(!txt) return "No supe qué responder a eso. ¿Me lo preguntas de otra forma?";
      S.cfg.iaModelo = m;
      iaHist.push({role:"user",parts:[{text:pregunta}]},{role:"model",parts:[{text:txt}]});
      if(iaHist.length>12) iaHist = iaHist.slice(-12);
      return txt;
    }catch(e){ clearTimeout(to); if(e.name==="AbortError") return "Tardó demasiado la respuesta. Revisa tu internet e inténtalo otra vez."; }
  }
  return "No pude conectarme con la inteligencia de Google. Revisa tu internet o tu clave e inténtalo otra vez.";
}

conversar = async function(entrada){
  if(!entrada || !entrada.trim()) return;
  let r = responder(entrada);
  belaLog.push({tu: entrada.trim(), bela: r ?? "Pensando…"}); if(belaLog.length>8) belaLog.shift();
  pintarLog();
  if(r === null){
    orbe("habla"); const st=document.getElementById("orbSt"); if(st) st.textContent="BELA · PENSANDO";
    r = await preguntarIA(entrada);
    belaLog[belaLog.length-1].bela = r; pintarLog(); orbe("");
  }
  hablar(r);
};

function panelIA(){
  const k = iaClave();
  return `<h3>Preguntas libres</h3>
   <p class="note">BELA responde sola todo lo de tu horario. Para cualquier otra pregunta, como tareas, la Biblia, recetas o consejos, se conecta a la inteligencia gratuita de Google (Gemini). Necesita internet.</p>
   <p class="note"><b>Cómo conseguir tu clave gratis:</b> entra a <span class="sel">aistudio.google.com/apikey</span> con tu cuenta de Google → <b>Create API key</b> → cópiala y pégala aquí.</p>
   <div class="row ask"><input type="password" id="iaKey" placeholder="${k?"Clave guardada ••••"+esc(k.slice(-4)):"Pega aquí tu clave de Google"}" aria-label="Clave de Google AI"><button class="btn sm" id="iaSave">${k?"Cambiar":"Guardar"}</button></div>
   <div class="row"><span class="pill ${k?"p-ok":"p-warn"}">${k?"Preguntas libres activadas":"Sin conectar"}</span>${k?`<button class="btn ghost sm" id="iaTest">Probar</button><button class="btn ghost sm" id="iaDel">Quitar clave</button>`:""}</div>
   <p class="note">La clave se guarda solo en este celular. En el plan gratuito, Google puede usar las preguntas para mejorar su servicio: no le cuentes datos privados de otras personas.</p>`;
}
function bindIA(){
  const $=id=>document.getElementById(id);
  $("iaSave").onclick=()=>{ const v=$("iaKey").value.trim(); if(v.length<20){ $("iaKey").value=""; $("iaKey").placeholder="Esa clave parece incompleta"; return; } iaGuardar(v); render(); };
  if($("iaTest")) $("iaTest").onclick=()=>conversar("Preséntate en una frase y dime un versículo corto de ánimo.");
  if($("iaDel")) $("iaDel").onclick=()=>{ iaGuardar(""); render(); };
}

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  ({asistente:renderAsistente,hoy:renderHoy,semana:renderSemana,mes:renderMes,tareas:renderTareas,ajustes:renderAjustes})[tab]();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});
render();
</script>
