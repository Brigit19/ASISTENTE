name: Crear APK de BELA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar el proyecto
        run: |
          mkdir -p www
          if [ -f index.html ]; then SRC=index.html; else SRC="$(ls index*.html | head -1)"; fi
          echo "Usando $SRC"
          cp "$SRC" www/index.html
          rm -f package-lock.json
          cat > package.json <<'JSON'
          {
            "name": "mi-asistente",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.2.2",
              "@capacitor/core": "6.2.2",
              "@capacitor/local-notifications": "6.1.3",
              "@capacitor-community/text-to-speech": "4.1.1",
              "@capacitor-community/speech-recognition": "6.0.1",
              "@capacitor/app": "6.0.3"
            },
            "devDependencies": { "@capacitor/cli": "6.2.2" }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "pe.brigit.miasistente",
            "appName": "BELA",
            "webDir": "www",
            "plugins": { "LocalNotifications": { "iconColor": "#8E72C4" } }
          }
          JSON
          npm install --no-audit --no-fund
          rm -rf android
          npx cap add android

      - name: Permisos de alarmas y voz
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          extra = '''
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
          </manifest>'''
          s = s.replace("</manifest>", extra, 1)
          open(p, "w").write(s)
          PY
          npx cap sync android

      - name: Sonidos y voz de BELA para las alarmas
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq espeak-ng ffmpeg || true
          pip install --quiet gTTS || pip install --quiet --break-system-packages gTTS || true
          cat > gen_sonidos.py <<'PY'
          #!/usr/bin/env python3
          """Genera los sonidos de BELA en res/raw: alarma, silencio y avisos con voz."""
          import math, os, struct, subprocess, sys, wave, shutil, tempfile

          RAW = sys.argv[1] if len(sys.argv) > 1 else "android/app/src/main/res/raw"
          SR = 22050
          os.makedirs(RAW, exist_ok=True)

          def tono(frecs, dur, vol=0.5, ataque=0.01, caida=0.25):
              n = int(SR * dur); out = []
              for i in range(n):
                  t = i / SR
                  env = min(1, t / ataque) * (math.exp(-t / caida) if caida else 1)
                  v = sum(math.sin(2 * math.pi * f * t) for f in frecs) / len(frecs)
                  out.append(v * env * vol)
              return out

          def silencio(dur): return [0.0] * int(SR * dur)

          def guardar(nombre, muestras):
              with wave.open(os.path.join(RAW, nombre), "wb") as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(SR)
                  w.writeframes(b"".join(struct.pack("<h", int(max(-1, min(1, s)) * 32000)) for s in muestras))

          def leer(path):
              with wave.open(path, "rb") as w:
                  assert w.getnchannels() == 1 and w.getsampwidth() == 2 and w.getframerate() == SR
                  d = w.readframes(w.getnframes())
              return [s / 32768 for s in struct.unpack("<%dh" % (len(d) // 2), d)]

          # Timbre de BELA (tres notas ascendentes) y tono de alarma (~9 s)
          timbre = tono([1046.5], .16, .45, caida=.12) + tono([1318.5], .16, .45, caida=.12) + tono([1568], .45, .5, caida=.3) + silencio(.15)
          pit = []
          for _ in range(6):
              pit += tono([880, 1760], .14, .6, caida=0) + silencio(.07) + tono([880, 1760], .14, .6, caida=0) + silencio(.07) + tono([1175, 2350], .22, .6, caida=0) + silencio(.85)
          guardar("alarma.wav", timbre + pit)
          guardar("silencio.wav", silencio(.3))

          NOMBRE = os.environ.get("BELA_NOMBRE", "Brigit")
          FRASES = {
              "despertar":    f"Buenos días, {NOMBRE}. Es hora de levantarte.",
              "salida":       f"{NOMBRE}, es hora de salir.",
              "clase":        f"{NOMBRE}, tu clase empieza pronto.",
              "iglesia":      f"{NOMBRE}, prepárate para ir a la iglesia.",
              "cocina":       f"{NOMBRE}, es hora de cocinar el almuerzo.",
              "tarea":        f"{NOMBRE}, tienes una tarea programada.",
              "dormir":       f"{NOMBRE}, es hora de prepararte para dormir.",
              "recordatorio": f"{NOMBRE}, BELA te recuerda algo.",
          }

          def voz_gtts(texto, destino):
              from gtts import gTTS
              tmp = destino + ".mp3"
              gTTS(texto, lang="es", tld="com.mx").save(tmp)
              subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", tmp, "-ac", "1", "-ar", str(SR), "-af", "volume=1.6", "-sample_fmt", "s16", destino], check=True)
              os.remove(tmp)

          def voz_espeak(texto, destino):
              tmp = destino + ".raw.wav"
              subprocess.run(["espeak-ng", "-v", "es-419+f3", "-s", "150", "-w", tmp, texto], check=True)
              subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", tmp, "-ac", "1", "-ar", str(SR), "-sample_fmt", "s16", destino], check=True)
              os.remove(tmp)

          motor = None
          with tempfile.TemporaryDirectory() as td:
              for cat, frase in FRASES.items():
                  voz = None
                  for nombre, fn in (("gtts", voz_gtts), ("espeak", voz_espeak)):
                      if motor and motor != nombre: continue
                      try:
                          p = os.path.join(td, cat + ".wav"); fn(frase, p); voz = leer(p); motor = nombre; break
                      except Exception as e:
                          print(f"  {nombre} no disponible para {cat}: {e}")
                  guardar(f"voz_{cat}.wav", timbre + (voz or []) + silencio(.2) + (timbre if not voz else []))
          print("Sonidos listos en", RAW, "· voz:", motor or "sin voz (solo timbre)")
          for f in sorted(os.listdir(RAW)): print("  ", f, os.path.getsize(os.path.join(RAW, f)), "bytes")
          PY
          python3 gen_sonidos.py android/app/src/main/res/raw

      - name: Firma fija (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BELA.apk

      - name: Publicar para descargar desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: BELA versión ${{ github.run_number }}
          body: Descarga BELA.apk desde tu celular Android e instálalo.
          files: BELA.apk
