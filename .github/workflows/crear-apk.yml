name: Crear APK de BELA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar el proyecto
        run: |
          mkdir -p www
          if [ -f index.html ]; then SRC=index.html; else SRC="$(ls index*.html | head -1)"; fi
          echo "Usando $SRC"
          cp "$SRC" www/index.html
          rm -f package-lock.json
          cat > package.json <<'JSON'
          {
            "name": "mi-asistente",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.2.2",
              "@capacitor/core": "6.2.2",
              "@capacitor/local-notifications": "6.1.3",
              "@capacitor-community/text-to-speech": "4.1.1",
              "@capacitor-community/speech-recognition": "6.0.1"
            },
            "devDependencies": { "@capacitor/cli": "6.2.2" }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "pe.brigit.miasistente",
            "appName": "BELA",
            "webDir": "www",
            "plugins": { "LocalNotifications": { "iconColor": "#8E72C4" } }
          }
          JSON
          npm install --no-audit --no-fund
          rm -rf android
          npx cap add android

      - name: Permisos de alarmas y voz
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          extra = '''
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
          </manifest>'''
          s = s.replace("</manifest>", extra, 1)
          open(p, "w").write(s)
          PY
          npx cap sync android

      - name: Firma fija (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BELA.apk

      - name: Publicar para descargar desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: BELA versión ${{ github.run_number }}
          body: Descarga BELA.apk desde tu celular Android e instálalo.
          files: BELA.apk
